<section class="main slider-container">
    <h2 class="h2 slider-title">{{title}}</h2>

    <!-- Skeleton Loader -->
    <ul class="slider-items" *ngIf="isLoading">
        <li class="slider-item skeleton-card" *ngFor="let item of skeletonItems.slice(0, itemsPerPage)">
            <div class="skeleton-img shimmer"></div>
            <div class="skeleton-info">
                <div class="skeleton-title shimmer"></div>
                <div class="skeleton-text shimmer"></div>
                <div class="skeleton-text short shimmer"></div>
                <div class="skeleton-price shimmer"></div>
            </div>
        </li>
    </ul>

    <!-- Items Reales -->
    <ul class="slider-items" *ngIf="!isLoading">
        <li class="slider-item" *ngFor="let item of pagedItems">
            <a [routerLink]="'/shop/'+ item.id">
                <picture class="item-cover">
                    <span class="item-tag">NUEVO</span>
                    <img class="item-img-front" [src]="item.front_image" alt="Figura coleccionable Funko" loading="lazy" decoding="async">
                    <img class="item-img-back" [src]="item.back_image" alt="Figura coleccionable Funko en caja" loading="lazy" decoding="async">
                </picture>

                <div class="item-info">
                    <h3 class="item-name">{{item.name}}</h3>
                    <p class="item-serie">{{item.serie}}</p>
                    <p class="item-license">{{item.licence}}</p>
                    <p class="item-price">${{item.price.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: true})}}</p>
                </div>
            </a>
        </li>
    </ul>

    <div class="slider-nav" *ngIf="!isLoading && pages.length > 1">
        <button class="button" (click)="changePage(currentPage - 1)">ANTERIOR</button>
        <button class="button" (click)="changePage(currentPage + 1)">SIGUIENTE</button>
    </div>
</section>
