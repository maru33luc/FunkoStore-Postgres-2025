<main class="shop-main">
    <!-- Skeleton Grid Loader -->
    <ul class="shop-main-items" *ngIf="isLoading">
        <li *ngFor="let item of skeletonItems.slice(0, itemsPerPage)">
            <article class="shop-main-item shop-skeleton-card">
                <div class="shop-skeleton-img shimmer"></div>
                <div class="shop-skeleton-info">
                    <div class="shop-skeleton-line title shimmer"></div>
                    <div class="shop-skeleton-line text shimmer"></div>
                    <div class="shop-skeleton-line short shimmer"></div>
                    <div class="shop-skeleton-line price shimmer"></div>
                </div>
            </article>
        </li>
    </ul>

    <!-- Real Items Grid -->
    <ul class="shop-main-items" *ngIf="!isLoading">
        <li *ngFor="let item of paginatedItems">
            <article class="shop-main-item">
                <a [routerLink]="'/shop/'+ item.id">
                    <picture class="item-cover">
                        <span class="item-tag">NUEVO</span>
                        <img class="item-img-front" [src]="item.image_url || item.front_image" alt="Figura coleccionable Funko" loading="lazy">
                        <img class="item-img-back" [src]="item.back_image" alt="Figura coleccionable Funko" loading="lazy">
                    </picture>
                    <div class="item-info">
                        <p class="item-name">{{item.name}}</p>
                        <p class="item-serie">{{item.serie}}</p>
                        <p class="item-license">{{item.licence}}</p>
                        <p class="item-price">${{item.price.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: true})}}</p>
                    </div>
                </a>
            </article>
        </li>
    </ul>

    <div class="pagination" *ngIf="!isLoading && showPagination">
        <ul class="pagination-list">
            <li id="pagination-previous-page" [class.disabled]="currentPage === 0"
                (click)="changePage(currentPage - 1)">
                «
            </li>
            <li class="pagination-page-link" *ngFor="let _ of pages; let i = index" [class.active]="i === currentPage"
                (click)="changePage(i)">{{ i + 1 }}
            </li>
            <li id="pagination-next-page" [class.disabled]="currentPage === pages.length - 1"
                (click)="changePage(currentPage + 1)">
                »
            </li>
        </ul>
    </div>
</main>
